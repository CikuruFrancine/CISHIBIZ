<style>
:root{--bg:#eef2f4;--surf:#fff;--ink:#14232b;--mut:#5d6e77;--line:#d5dde1;--acc:#0f6e6e;--accT:#fff;--warn:#b86e00;--warnBg:#fdf0d5;--bad:#c8452f;--badBg:#fbe4df;--ok:#2c7a4b;--okBg:#dff3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181c;--surf:#1a262c;--ink:#e8eff2;--mut:#93a5ad;--line:#2c3b43;--acc:#4fc3c3;--accT:#06201f;--warn:#f0b650;--warnBg:#3a2d12;--bad:#ff8a73;--badBg:#3d1f19;--ok:#6fd397;--okBg:#173326}}
:root[data-theme="dark"]{--bg:#10181c;--surf:#1a262c;--ink:#e8eff2;--mut:#93a5ad;--line:#2c3b43;--acc:#4fc3c3;--accT:#06201f;--warn:#f0b650;--warnBg:#3a2d12;--bad:#ff8a73;--badBg:#3d1f19;--ok:#6fd397;--okBg:#173326}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.35}
#app{max-width:440px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{padding:18px 18px 6px}h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;font-weight:600;background:var(--acc);color:var(--accT);transition:transform .1s}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.danger{background:var(--bad);color:#fff}button.dghost{background:var(--badBg);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px 0}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--mut)}
.stat.w b{color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 18px 4px}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:var(--surf);color:var(--ink);border:1.5px solid var(--line);font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{padding:8px 18px}
.item{display:block;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left;color:var(--ink)}
.item .top{display:flex;gap:12px;align-items:center}
.ico{width:44px;height:44px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.grow{flex:1;min-width:0}.name{font-weight:600}.ref{color:var(--mut);font-size:13px}
.qty{font-size:22px;font-weight:800;text-align:right;line-height:1}.qty small{display:block;font-size:11px;font-weight:400;color:var(--mut);margin-top:3px}
.bar{height:4px;background:var(--bg);border-radius:2px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.low .bar i{background:var(--warn)}.low .qty{color:var(--warn)}
.badge{display:inline-block;font-size:12px;font-weight:600;background:var(--warnBg);color:var(--warn);border-radius:6px;padding:1px 7px;margin-left:6px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 4px;font-size:13px}nav button span{display:block;font-size:20px}nav button.on{color:var(--acc)}
.fab{position:fixed;right:max(18px,calc(50% - 202px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:4}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.bg.c{z-index:30;align-items:center;padding:20px}
.sheet{background:var(--surf);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.dlg{background:var(--surf);width:100%;max-width:340px;border-radius:16px;padding:20px}
.dlg h3{margin:0 0 6px;font-size:18px}.dlg p{margin:0 0 16px;color:var(--mut)}
.sheet h2{margin:0 0 4px;font-size:20px}
.dr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.dr b{font-size:18px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.acts.two{grid-template-columns:1fr 1fr}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}.seg button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.emo{display:flex;gap:6px;flex-wrap:wrap}.emo button{background:var(--bg);border:1.5px solid var(--line);font-size:20px;padding:6px 10px}.emo button.on{border-color:var(--acc);background:var(--surf)}
.hist{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.tag{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.t-in{background:var(--okBg);color:var(--ok)}.t-out{background:var(--badBg);color:var(--bad)}.t-tr{background:var(--bg);color:var(--acc)}
.err{background:var(--badBg);color:var(--bad);font-size:14px;padding:8px 10px;border-radius:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;max-width:90%;text-align:center}
.login{padding:max(60px,12vh) 24px 24px}.login .logo{width:64px;height:64px;border-radius:18px;background:var(--acc);display:grid;place-items:center;font-size:32px;margin-bottom:18px}.login h1{margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surf);border-radius:12px}.tbl th,.tbl td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:10px}.tbl th{font-size:12px;color:var(--mut);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:36px 20px}

:root{--bg:#F1F4F8;--surf:#fff;--ink:#0F1B2D;--mut:#66768A;--line:#E2E8F0;--acc:#1673B0;--accT:#fff;--sh:0 1px 2px rgba(15,27,45,.06),0 6px 18px rgba(15,27,45,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B121A;--surf:#131D28;--ink:#E8EEF4;--mut:#8DA0B3;--line:#22303F;--acc:#4DB6E8;--accT:#04202F;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0B121A;--surf:#131D28;--ink:#E8EEF4;--mut:#8DA0B3;--line:#22303F;--acc:#4DB6E8;--accT:#04202F;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#app{padding-bottom:104px}h1{font-size:22px;font-weight:700;letter-spacing:-.02em}header{padding:6px 18px 4px}
button{border-radius:12px;font-weight:600}input,select{border-radius:12px;padding:12px 14px}
.ic{width:20px;height:20px;vertical-align:-4px}
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px)}
.topbar .av{width:42px;height:42px;padding:0;border-radius:50%;overflow:hidden;border:2px solid var(--surf);box-shadow:var(--sh);background:var(--surf)}
.topbar .av img{width:100%;height:100%;object-fit:cover;display:block}
.tbt{flex:1;min-width:0}.tbt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbt span{font-size:12px;color:var(--mut)}
.ibtn{width:40px;height:40px;padding:0;border-radius:12px;background:var(--surf);color:var(--ink);box-shadow:var(--sh);display:grid;place-items:center}
.hero{margin:4px 16px 10px;padding:20px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#0F2A44 0%,#1673B0 68%,#1E9AD6 100%);box-shadow:0 10px 26px rgba(22,115,176,.3)}
.hello{font-size:13px;opacity:.82}.hname{font-size:26px;font-weight:800;letter-spacing:.02em;margin-top:2px}.hsub{font-size:13px;opacity:.82}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hstats div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px}.hstats b{display:block;font-size:17px}.hstats span{font-size:12px;opacity:.85}.hstats .w b{color:#FFD27A}
.item,.hist,.stat,.card{border:0;box-shadow:var(--sh);border-radius:16px}.item{padding:12px 14px}.ico{border-radius:12px}
.chip{border:0;box-shadow:var(--sh);border-radius:20px}.chip.on{background:var(--acc);color:var(--accT)}
nav{bottom:12px;width:calc(100% - 24px);max-width:416px;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(15,27,45,.2);padding:6px;gap:4px}
nav button{border-radius:16px;font-size:11px;padding:8px 2px}nav button span{display:grid;place-items:center;margin-bottom:2px}nav button.on{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.fab{bottom:92px;border-radius:16px;box-shadow:0 8px 20px rgba(22,115,176,.35)}
.card{background:var(--surf);padding:16px;margin:0 16px 14px}.card h3{margin:0 0 10px;font-size:15px}
.pav{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--surf);box-shadow:var(--sh);flex:none}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid var(--surf);box-shadow:var(--sh);display:inline-grid;place-items:center;color:#fff;margin:0 8px 8px 0}
.pri{background:var(--acc);color:var(--accT)}
.paper{background:#fff;color:#111;border-radius:14px;padding:16px;box-shadow:var(--sh);margin-top:12px}.plogo{height:58px;display:block}
.ptitle{text-align:center;font-weight:800;font-size:16px;margin-top:4px}.psub{text-align:center;font-size:12px;color:#444;margin-bottom:10px}
.paper .tbl{background:#fff;min-width:560px}.paper .tbl th,.paper .tbl td{border:1px solid #222;color:#111;padding:6px 8px;font-size:12px}.paper .tbl td:nth-child(n+4){text-align:right}.paper .tbl td:nth-child(-n+3),.paper .tbl th{text-align:left}
.tots{margin-top:12px;border-top:2px solid #111;padding-top:8px}.tots div{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding:3px 0}
.splash{position:fixed;inset:0;z-index:99;background:#141820;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:fi .8s ease}
.sn{font-size:34px;font-weight:800;letter-spacing:6px;margin-top:26px}.st{font-size:11px;letter-spacing:5px;color:#8A97A8;margin-top:8px}
.sl{width:22px;height:22px;border:2.5px solid #F0B531;border-right-color:transparent;border-radius:50%;margin-top:40px;animation:sp 1s linear infinite}
@keyframes fi{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}@keyframes sp{to{transform:rotate(360deg)}}
.login .logo{width:68px;height:68px;border-radius:20px;background:#141820;display:grid;place-items:center}.welc{font-size:24px;margin:18px 0 12px;line-height:1.2}.welc b{font-weight:800}
